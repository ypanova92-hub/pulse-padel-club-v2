<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="map-title">
  <title id="map-title">Illustrated map of the area around PULSE Padel Club</title>
  <defs>
    <pattern id="blocks" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
      <rect width="64" height="64" fill="#141914"/>
      <rect x="6" y="6" width="52" height="52" fill="#1a201b"/>
    </pattern>
    <pattern id="blocks-fine" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <rect width="40" height="40" fill="#141914"/>
      <rect x="4" y="4" width="32" height="32" fill="#191f1a"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d2ef30" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d2ef30" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- City blocks: two street grids meeting along the main avenue -->
  <rect width="800" height="800" fill="url(#blocks)"/>
  <path d="M0 470 L800 300 L800 800 L0 800 Z" fill="url(#blocks-fine)"/>

  <!-- Park -->
  <path d="M86 92 L268 58 L300 196 L118 232 Z" fill="#18241a"/>
  <path d="M120 120 C160 140 190 110 240 130 M140 190 C180 170 220 196 268 176" stroke="#223221" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- River -->
  <path d="M-20 650 C120 600 210 690 340 640 S560 520 660 580 S790 650 830 610" stroke="#122338" stroke-width="58" fill="none" stroke-linecap="round"/>
  <path d="M-20 650 C120 600 210 690 340 640 S560 520 660 580 S790 650 830 610" stroke="#17304d" stroke-width="2" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Minor streets -->
  <g stroke="#232a25" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M0 214 L800 30"/>
    <path d="M0 330 L800 146"/>
    <path d="M60 0 L210 800"/>
    <path d="M330 0 L470 800"/>
    <path d="M560 0 L700 800"/>
    <path d="M0 560 L800 400"/>
  </g>

  <!-- Main roads -->
  <g stroke="#2e3731" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M0 470 L800 300"/>
    <path d="M200 0 L320 800"/>
  </g>
  <path d="M520 -20 C470 160 610 300 560 460 S520 700 600 820" stroke="#2e3731" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g stroke="#3b463e" stroke-width="1.5" stroke-dasharray="10 12" fill="none">
    <path d="M0 470 L800 300"/>
    <path d="M200 0 L320 800"/>
  </g>

  <!-- Bridges -->
  <g stroke="#3b463e" stroke-width="18" stroke-linecap="butt">
    <path d="M300 612 L306 676"/>
    <path d="M562 560 L560 616"/>
  </g>

  <!-- Club marker -->
  <circle cx="404" cy="392" r="120" fill="url(#glow)"/>
  <circle cx="404" cy="392" r="44" fill="none" stroke="#d2ef30" stroke-opacity=".35" stroke-width="1.5"/>
  <circle cx="404" cy="392" r="26" fill="none" stroke="#d2ef30" stroke-opacity=".6" stroke-width="1.5"/>
  <circle cx="404" cy="392" r="11" fill="#d2ef30"/>
  <circle cx="404" cy="392" r="4" fill="#10130f"/>
  <g font-family="'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="1.6">
    <rect x="432" y="408" width="198" height="34" fill="#10130f"/>
    <text x="446" y="430" fill="#d2ef30">PULSE PADEL CLUB</text>
  </g>
</svg>
